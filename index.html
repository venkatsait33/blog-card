<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog-card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="w-full h-screen flex justify-center items-center mx-auto">
        <div class="w-[340px] shadow-lg rounded-lg">
            <div>
                <figure>
                    <img src="https://vaqybtnqyonvlwtskzmv.supabase.co/storage/v1/object/public/projects-images/blog-card/starter/img/blog-article-image.jpg"
                        alt="" class="w-full h-[288px] object-cover rounded-md">
                </figure>
            </div>
            <div class="p-4">
                <div class="mt-2">
                    <span
                        class="text-[#15803d] bg-[#f0fdf4] border-2 rounded-lg px-2 py-1 text-xs font-bold">Interior</span>
                </div>
                <div class="m-2">
                    <h1 class="text-xl font-bold">Top 5 Living Room Inspirations</h1>
                    <p>
                        Curated vibrants colors for your living, make it pop & calm in the same time.
                    </p>
                    <div class="m-2">
                        <button class="flex items-center gap-2
                                     hover:text-[#4338ca] hover:bg-[#f6f3ff] px-3 py-1 rounded-lg mt-3 text-sm font-bold  
                                     hover:border-[#4338ca] hover:border-2">Read more <span><svg width="15" height="15"
                                    viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M13.4763 9.16658L9.00633 4.69657L10.1848 3.51807L16.6667 9.99992L10.1848 16.4817L9.00633 15.3032L13.4763 10.8332H3.33333V9.16658H13.4763Z"
                                        fill="currentColor" />
                                </svg></span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
